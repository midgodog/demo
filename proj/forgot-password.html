<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Aurelia</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="simple-auth"><a class="brand" href="index.html"><span
            class="brand-mark">A</span><span><strong>AURELIA</strong><small>GRAND RESORT</small></span></a>
    <main class="simple-auth-card">
        <p class="eyebrow">ACCOUNT ASSISTANCE</p>
        <h1>Forgot your<br><em>password?</em></h1>
        <p>Enter the email associated with your demo account. A reset confirmation will be shown on this page.</p>
        <form id="forgotForm" novalidate>
            <div class="field"><label for="forgotEmail">Email address *</label><input id="forgotEmail" type="email"
                    required placeholder="you@example.com"><small class="error"></small></div><button
                class="button button-gold button-full" type="submit">Request reset link ↗</button>
            <div id="forgotMessage" class="inline-message" role="status"></div>
        </form><a class="text-link dark-link" href="login.html">← Back to sign in</a>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/jquery-effects.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
